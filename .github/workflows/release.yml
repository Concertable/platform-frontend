name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@concertable'

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Verify before releasing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # Accumulated changesets open a version pull request; an already-versioned main publishes.
      # Each package's own prepack rebuilds its dist, so publication never ships a stale tree.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run changeset:version
          publish: npm run release
          title: 'chore(release): version the frontend platform tiers'
          commit: 'chore(release): version the frontend platform tiers'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The org's npm-publish.yml only proves a packed tarball installs. These tiers state Metro and
      # NativeWind resolution against a built dist as their boundary, which is what this proves.
      - name: Verify the published tiers from the feed
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          node - <<'NODE' > published.txt
          const flags = {
            "@concertable/build-config": [],
            "@concertable/shared": ["--metro"],
            "@concertable/web": [],
            "@concertable/mobile": ["--metro-only"],
          };
          for (const { name, version } of JSON.parse(process.env.PUBLISHED)) {
            process.stdout.write([`${name}@${version}`, name, ...(flags[name] ?? [])].join(" ") + "\n");
          }
          NODE
          while read -r target name rest; do
            echo "::group::verify $target"
            npm exec verify-fe-package -- "$target" "$name" $rest
            echo "::endgroup::"
          done < published.txt
